name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Conversational benchmark (offline runner)
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm run benchmark

  install-smoke:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Install tarball globally (POSIX)
        if: runner.os != 'Windows'
        run: npm install -g ./sessionmem-*.tgz

      - name: Install tarball globally (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tarball = Get-ChildItem -Filter "sessionmem-*.tgz" | Select-Object -First 1
          npm install -g "./$($tarball.Name)"

      - name: Run sessionmem --version (POSIX)
        if: runner.os != 'Windows'
        run: |
          EXPECTED=$(node -p "require('./package.json').version")
          VERSION=$(sessionmem --version)
          echo "version: $VERSION (expected: $EXPECTED)"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "Expected version $EXPECTED, got $VERSION"
            exit 1
          fi

      - name: Run sessionmem --version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = node -p "require('./package.json').version"
          $version = (sessionmem --version).Trim()
          Write-Host "version: $version (expected: $expected)"
          if ($version -ne $expected) {
            Write-Error "Expected version $expected, got $version"
            exit 1
          }

      - name: Run sessionmem ping
        run: sessionmem ping

      - name: sessionmem install (isolated temp HOME, POSIX)
        if: runner.os != 'Windows'
        run: |
          TMP_HOME="$(mktemp -d)"
          export HOME="$TMP_HOME"
          # Native login managers are mocked; one real capture sweep still runs.
          export NODE_OPTIONS="--require \"$(pwd)/scripts/lib/autostart-test-preload.cjs\""
          sessionmem install --adapter claude-code
          if [ ! -f "$TMP_HOME/.sessionmem/config.json" ]; then
            echo "config.json was not written to isolated HOME ($TMP_HOME)"
            exit 1
          fi
          echo "config.json found at $TMP_HOME/.sessionmem/config.json"
          sessionmem doctor --adapter claude-code
          sessionmem autostart status
          sessionmem uninstall --adapter claude-code

      - name: sessionmem install (isolated temp HOME, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmpHome = Join-Path $env:RUNNER_TEMP "sessionmem-home"
          New-Item -ItemType Directory -Force -Path $tmpHome | Out-Null
          $env:HOME = $tmpHome
          $env:USERPROFILE = $tmpHome
          $env:HOMEDRIVE = (Split-Path $tmpHome -Qualifier)
          $env:HOMEPATH = (Split-Path $tmpHome -NoQualifier)
          # NODE_OPTIONS parses backslashes as escapes even inside quotes.
          $preloadPath = Join-Path $env:GITHUB_WORKSPACE 'scripts/lib/autostart-test-preload.cjs'
          $env:NODE_OPTIONS = '--require ' + (ConvertTo-Json -InputObject $preloadPath -Compress)
          sessionmem install --adapter claude-code
          $configPath = Join-Path $tmpHome ".sessionmem\config.json"
          if (-not (Test-Path $configPath)) {
            Write-Error "config.json was not written to isolated HOME ($configPath)"
            exit 1
          }
          Write-Host "config.json found at $configPath"
          sessionmem doctor --adapter claude-code
          sessionmem autostart status
          sessionmem uninstall --adapter claude-code
