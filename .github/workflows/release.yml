name: Release

# Tag-triggered npm publish (QLTY-05 / D-15).
# Prefer npm trusted publishing via GitHub OIDC (no stored long-lived token,
# automatic Sigstore provenance). A documented NPM_TOKEN fallback is provided
# below for the case where the one-time npmjs.com trusted-publisher UI setup
# (Package -> Settings -> Trusted Publisher) has not been completed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      otp:
        description: "npm 2FA one-time password"
        required: false
        default: ""

# Least-privilege at the workflow level (V4 access control / T-08-13):
# do NOT grant id-token here. id-token: write is scoped to the publish job only
# so a compromised step in any other (future) job cannot mint an OIDC token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release below
      id-token: write # REQUIRED for OIDC trusted publishing + automatic provenance (scoped to this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Install, build and test with the npm that ships with node 22.
      #
      # ORDER MATTERS: the npm upgrade below MUST come after `npm ci`. npm 12
      # does not run dependencies' install scripts the way npm 10 does, so
      # installing under it leaves better-sqlite3 without its compiled binding
      # and every database-backed test dies with "Could not locate the bindings
      # file" (229 of 479 tests, which is what blocked the v1.3.0 publish).
      # The newer npm is only needed for the publish step itself.
      - run: npm ci

      - run: npm run build

      - run: npm test

      # node 22 ships npm 10.x, which does NOT support OIDC trusted publishing
      # (introduced in npm 11.5.1). Without this upgrade the "Publish to npm" step
      # below silently falls through to token auth and fails with ENEEDAUTH when
      # NPM_TOKEN is unset — the root cause of releases not auto-publishing. Pin to
      # a version new enough for trusted publishing + automatic provenance.
      # Runs after the install/build/test steps above; see the ORDER MATTERS note.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # OIDC trusted publishing is auto-detected when id-token: write is present
      # AND npm >= 11.5.1 (see the upgrade step above); provenance is emitted
      # automatically, so no --provenance flag is needed. NODE_AUTH_TOKEN is a
      # documented fallback for when the npmjs.com trusted-publisher UI setup has
      # not been completed — set the NPM_TOKEN repo secret to use it.
      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published on npm; skipping publish."
          else
            npm publish --access public ${NPM_OTP:+--otp="$NPM_OTP"}
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ github.event.inputs.otp }}

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            /^## / { section = ($2 == "[" version "]"); found = found || section; next }
            section || /^\[[^]]+\]:/ { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$NOTES_FILE" || {
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          }
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag
