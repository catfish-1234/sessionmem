name: Release

# Tag-triggered npm publish (QLTY-05 / D-15).
# Prefer npm trusted publishing via GitHub OIDC (no stored long-lived token,
# automatic Sigstore provenance). A documented NPM_TOKEN fallback is provided
# below for the case where the one-time npmjs.com trusted-publisher UI setup
# (Package -> Settings -> Trusted Publisher) has not been completed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      otp:
        description: "npm 2FA one-time password"
        required: false
        default: ""

# Least-privilege at the workflow level (V4 access control / T-08-13):
# do NOT grant id-token here. id-token: write is scoped to the publish job only
# so a compromised step in any other (future) job cannot mint an OIDC token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release below
      id-token: write # REQUIRED for OIDC trusted publishing + automatic provenance (scoped to this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag, so the publish step can tell whether this is the newest version.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Install, build and test with the npm that ships with node 22.
      #
      # ORDER MATTERS: the npm upgrade below MUST come after `npm ci`. npm 12
      # does not run dependencies' install scripts the way npm 10 does, so
      # installing under it leaves better-sqlite3 without its compiled binding
      # and every database-backed test dies with "Could not locate the bindings
      # file" (229 of 479 tests, which is what blocked the v1.3.0 publish).
      # The newer npm is only needed for the publish step itself.
      - run: npm ci

      - run: npm run build

      - run: npm test

      # node 22 ships npm 10.x, which does NOT support OIDC trusted publishing
      # (introduced in npm 11.5.1). Without this upgrade the "Publish to npm" step
      # below silently falls through to token auth and fails with ENEEDAUTH when
      # NPM_TOKEN is unset — the root cause of releases not auto-publishing. Pin to
      # a version new enough for trusted publishing + automatic provenance.
      # Runs after the install/build/test steps above; see the ORDER MATTERS note.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # OIDC trusted publishing is auto-detected when id-token: write is present
      # AND npm >= 11.5.1 (see the upgrade step above); provenance is emitted
      # automatically, so no --provenance flag is needed. NODE_AUTH_TOKEN is a
      # documented fallback for when the npmjs.com trusted-publisher UI setup has
      # not been completed — set the NPM_TOKEN repo secret to use it.
      #
      # Only the newest version takes npm's `latest` dist-tag. An older tag (a backfilled release,
      # or a run that finishes after a newer one) publishes under `legacy`, and a prerelease under
      # `next`, so the order in which runs finish can never move `npm install sessionmem` back.
      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published on npm; skipping publish."
            exit 0
          fi
          HIGHEST="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            "$HIGHEST") DIST_TAG=latest ;;
            *) DIST_TAG=legacy; echo "v$VERSION is older than v$HIGHEST, so it does not take the latest dist-tag." ;;
          esac
          npm publish --access public --tag "$DIST_TAG" ${NPM_OTP:+--otp="$NPM_OTP"}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_OTP: ${{ github.event.inputs.otp }}

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists; skipping creation."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v version="$VERSION" '
            /^## / { section = ($2 == "[" version "]"); found = found || section; next }
            section || /^\[[^]]+\]:/ { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$NOTES_FILE" || {
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          }
          # Only the newest version is marked as the repository's latest release.
          HIGHEST="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          case "$VERSION" in
            *-*) FLAGS="--prerelease --latest=false" ;;
            "$HIGHEST") FLAGS="--latest" ;;
            *) FLAGS="--latest=false" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES_FILE" --verify-tag $FLAGS

      # The official MCP Registry (registry.modelcontextprotocol.io), which MCP clients and server
      # directories read from. It checks ownership through package.json's mcpName on the npm
      # version server.json names, so it runs after the npm publish, and last, so a registry outage
      # cannot hold up the npm or GitHub release. Authenticates with this job's GitHub OIDC token;
      # no secret. To list a version again, run this workflow from the Actions tab.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.16
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          # A version the registry already lists is not a failure of this release.
          if ! ./mcp-publisher publish 2>&1 | tee "$RUNNER_TEMP/mcp-publish.log"; then
            if grep -qiE "already exists|duplicate|already published" "$RUNNER_TEMP/mcp-publish.log"; then
              echo "This version is already in the MCP Registry."
              exit 0
            fi
            exit 1
          fi
